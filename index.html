<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나주숲교회 인테리어 현황</title>
<meta name="description" content="나주숲교회 공간 인테리어 진행 현황을 날짜별 사진으로 나눕니다">
<meta property="og:title" content="나주숲교회 인테리어 현황">
<meta property="og:description" content="우리 교회 공간이 이렇게 준비되고 있습니다.">
<meta property="og:image" content="images/s1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec; --surface:#fffdf8; --ink:#1f2a24; --muted:#5f6b63;
    --forest:#2f6b5a; --forest-soft:#dfece6; --line:#e3ddd0; --accent:#b8864b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141a17; --surface:#1c241f; --ink:#ece8df; --muted:#a3ada6;
      --forest:#7cc2a8; --forest-soft:#22352d; --line:#2c3731; --accent:#d9aa6e; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141a17; --surface:#1c241f; --ink:#ece8df; --muted:#a3ada6;
    --forest:#7cc2a8; --forest-soft:#22352d; --line:#2c3731; --accent:#d9aa6e; color-scheme:dark;
  }
  *{box-sizing:border-box}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  header.hero{padding:64px 0 36px;text-align:center}
  .badge{display:inline-block;font-size:13px;letter-spacing:.08em;color:var(--forest);
    background:var(--forest-soft);padding:5px 14px;border-radius:999px;font-weight:500}
  h1{font-family:"Gowun Batang",serif;font-weight:700;font-size:clamp(30px,6vw,46px);
    margin:18px 0 10px;letter-spacing:-.01em}
  .lead{color:var(--muted);font-size:clamp(15px,2.4vw,17px);margin:0 auto;max-width:560px}
  .date{margin-top:14px;font-size:13px;color:var(--muted)}

  nav.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  nav.toc .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
  nav.toc a{flex:0 0 auto;text-decoration:none;color:var(--ink);font-size:14px;
    padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
  nav.toc a:hover{border-color:var(--forest);color:var(--forest)}

  section.room{padding:48px 0 8px}
  .room-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;
    border-bottom:1px solid var(--line);padding-bottom:12px}
  .num{font-family:"Gowun Batang",serif;color:var(--accent);font-size:15px;font-weight:700}
  h2{font-family:"Gowun Batang",serif;font-size:clamp(22px,4vw,28px);margin:0;font-weight:700}
  .count{margin-left:auto;font-size:13px;color:var(--muted)}

  .rows{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:12px;margin-inline:auto;width:min(100%, calc(var(--sum) * 520px))}
  .row figure{flex:var(--r) 1 0;aspect-ratio:var(--r);min-width:0;max-width:100%;margin:0;border-radius:12px;
    overflow:hidden;background:var(--surface);border:1px solid var(--line);cursor:zoom-in}
  .row img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
  .row figure:hover img{transform:scale(1.03)}
  .row figure:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
  @media (max-width:640px){
    .row.land{flex-wrap:wrap}
    .row.land figure{flex-basis:100%}
  }
  @media (prefers-reduced-motion:reduce){.row img{transition:none}}

  nav.tabs a{display:flex;flex-direction:column;align-items:center;line-height:1.3;padding:7px 16px;border-radius:12px}
  nav.tabs a .d{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  nav.tabs a .c{font-size:12px;color:var(--muted)}
  nav.tabs a[aria-selected="true"]{background:var(--forest);border-color:var(--forest);color:var(--bg)}
  nav.tabs a[aria-selected="true"] .c{color:var(--forest-soft)}
  .day-head{padding-top:36px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
  .day-head h2{font-size:clamp(24px,4.5vw,32px)}
  .day-head p{margin:0;color:var(--muted);font-size:14px}
  .new{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin-top:2px}
  .hands{margin-top:64px;padding-block:56px;background:var(--forest-soft)}
  .hands-head{max-width:600px;margin-bottom:28px}
  .eyebrow{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--forest);font-weight:700}
  .hands-head h2{font-size:clamp(24px,4.5vw,32px);margin:6px 0 8px;text-wrap:balance}
  .hands-lead{margin:0;color:var(--muted);font-size:15px}
  .hand-list{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
  .hand{display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;align-items:stretch}
  .hand img{width:104px;aspect-ratio:4/5;object-fit:cover;border-radius:10px;cursor:zoom-in;flex:0 0 auto}
  .hand-body{min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
  .hand-name{font-family:"Gowun Batang",serif;font-weight:700;font-size:20px;line-height:1.3}
  .hand-role{font-size:13px;color:var(--forest);font-weight:500}
  .hand-note{font-family:"Gowun Batang",serif;font-size:15px;color:var(--ink)}
  .hand-note::before{content:"“"}.hand-note::after{content:"”"}
  .hand-dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .hand-dates a{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
  .hand-dates a:hover{color:var(--forest);border-color:var(--forest)}
  .show{padding-top:32px}
  .show-link{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);border:1px solid var(--line);
    background:var(--surface);border-radius:14px;padding:18px 20px}
  .show-link:hover{border-color:var(--forest)}
  .show-k{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:700}
  .show-t{font-family:"Gowun Batang",serif;font-size:19px;font-weight:700}
  footer{padding:56px 0 64px;text-align:center;color:var(--muted);font-size:14px}
  footer .verse{font-family:"Gowun Batang",serif;color:var(--ink);font-size:17px;margin-bottom:8px}
  footer a{color:var(--forest)}

  .lb{position:fixed;inset:0;background:rgba(10,14,12,.94);display:none;align-items:center;
    justify-content:center;z-index:50;padding:16px}
  .lb.open{display:flex}
  .lb img{max-width:100%;max-height:86vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .lb .cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#e8e4da;font-size:14px}
  .lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;width:44px;height:44px;
    border-radius:50%;font-size:22px;cursor:pointer}
  .lb .x{top:16px;right:16px}
  .lb .prev{left:12px;top:50%;transform:translateY(-50%)}
  .lb .next{right:12px;top:50%;transform:translateY(-50%)}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <span class="badge">공사 진행 현황</span>
    <h1>나주숲교회 인테리어</h1>
    <p class="lead">성도님들과 함께 기도하며 준비해 온 우리 교회 공간이<br>하나씩 모습을 갖춰 가고 있습니다.</p>
    <p class="date" id="latest"></p>
  </div>
</header>

<nav class="toc tabs" aria-label="날짜별 보기">
  <div class="wrap" id="tabs" role="tablist"></div>
</nav>

<main class="wrap" id="day"></main>

<section class="hands" aria-labelledby="hands-title">
  <div class="wrap">
    <div class="hands-head">
      <p class="eyebrow">Thanks to</p>
      <h2 id="hands-title">함께 세워 가는 손길</h2>
      <p class="hands-lead">이 공간에는 묵묵히 땀 흘려 주신 분들의 시간이 담겨 있습니다. 감사한 마음으로 한 분 한 분 기록합니다.</p>
    </div>
    <div class="hand-list" id="hands"></div>
  </div>
</section>

<section class="show">
  <div class="wrap">
    <a class="show-link" href="slides.html">
      <span class="show-k">입당예배 상영용</span>
      <span class="show-t">공사 이야기 슬라이드쇼 보기 →</span>
    </a>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="verse">There's a place for you here.<br>당신을 위해 준비된 공간</div>
    <div>나주숲교회 · <a href="https://najuforest.org" target="_blank" rel="noopener">najuforest.org</a></div>
  </div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="x" aria-label="닫기">×</button>
  <button class="prev" aria-label="이전">‹</button>
  <img alt="">
  <button class="next" aria-label="다음">›</button>
  <div class="cap"></div>
</div>

<script src="data.js"></script>
<script>

const WD = ["일","월","화","수","목","금","토"];
const fmt = (iso, long) => { const [y,m,d] = iso.split("-").map(Number); const w = WD[new Date(y,m-1,d).getDay()];
  return long ? `${y}년 ${m}월 ${d}일 (${w})` : `${m}.${String(d).padStart(2,"0")} (${w})`; };
const count = u => u.rooms.reduce((a,r)=>a+r.rows.flat().length,0);
const tabs = document.getElementById("tabs"), day = document.getElementById("day");
const latest = UPDATES[UPDATES.length-1];
document.getElementById("latest").textContent = `최근 업데이트 · ${fmt(latest.date,true)}`;

UPDATES.forEach(u => {
  const a = document.createElement("a");
  a.href = "#" + u.date; a.setAttribute("role","tab"); a.dataset.date = u.date;
  a.innerHTML = `<span class="d">${fmt(u.date)}</span><span class="c">사진 ${count(u)}장</span>` + (u===latest?`<span class="new">NEW</span>`:"");
  a.addEventListener("click", e => { e.preventDefault(); render(u.date, true); });
  tabs.appendChild(a);
});

let figs = [];
function render(date, scroll){
  const u = UPDATES.find(x=>x.date===date) || latest;
  [...tabs.children].forEach(t => t.setAttribute("aria-selected", t.dataset.date===u.date));
  tabs.querySelector('[aria-selected="true"]').scrollIntoView({inline:"center",block:"nearest"});
  try { history.replaceState(null,"","#"+u.date); } catch(e){}
  let h = `<div class="day-head"><h2>${fmt(u.date,true)}</h2>${u.note?`<p>${u.note}</p>`:""}</div>`;
  u.rooms.forEach((r,ri) => {
    const n = r.rows.flat().length;
    h += `<section class="room"><div class="room-head"><span class="num">${String(ri+1).padStart(2,"0")}</span><h2>${r.name}</h2><span class="count">사진 ${n}장</span></div><div class="rows">`;
    r.rows.forEach(row => {
      const rs = row.map(([,w,hh]) => w/hh), sum = rs.reduce((a,b)=>a+b,0);
      const land = rs.every(x => x > 1.3) && row.length > 1;
      h += `<div class="row${land?" land":""}" style="--sum:${sum.toFixed(3)}">` +
        row.map(([src,,,alt],k)=>`<figure tabindex="0" style="--r:${rs[k].toFixed(3)}"><img src="${src}" alt="${alt}" loading="lazy"></figure>`).join("") + `</div>`;
    });
    h += `</div></section>`;
  });
  day.innerHTML = h;
  figs = [...day.querySelectorAll("figure img")];
  figs.forEach((f,n) => { const p=f.parentElement; p.addEventListener("click",()=>show(n));
    p.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); show(n);} }); });
  if (scroll) document.querySelector("nav.tabs").scrollIntoView({block:"start"});
}
render(decodeURIComponent(location.hash.slice(1)), false);

const lb=document.getElementById('lb'),img=lb.querySelector('img'),cap=lb.querySelector('.cap');
let i=0;
const show=n=>{i=(n+figs.length)%figs.length;img.src=figs[i].src;cap.textContent=figs[i].alt;lb.classList.add('open')};
lb.querySelector('.x').onclick=()=>lb.classList.remove('open');
lb.querySelector('.prev').onclick=e=>{e.stopPropagation();show(i-1)};
lb.querySelector('.next').onclick=e=>{e.stopPropagation();show(i+1)};
lb.addEventListener('click',e=>{if(e.target===lb)lb.classList.remove('open')});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});
const hl = document.getElementById("hands");
HANDS.forEach(h => {
  const el = document.createElement("article"); el.className = "hand";
  el.innerHTML = `<img src="${h.photo[0]}" alt="${h.name}" loading="lazy">
    <div class="hand-body"><div class="hand-name">${h.name}</div><div class="hand-role">${h.role}</div>
    ${h.note?`<div class="hand-note">${h.note}</div>`:""}
    <div class="hand-dates">${h.dates.map(d=>`<a href="#${d}" data-d="${d}">${fmt(d)}</a>`).join("")}</div></div>`;
  el.querySelector("img").addEventListener("click", () => { img.src = h.photo[0]; cap.textContent = h.name + " · " + h.role; lb.classList.add("open"); });
  el.querySelectorAll("[data-d]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); render(a.dataset.d, true); }));
  hl.appendChild(el);
});
let sx=0;lb.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)show(d<0?i+1:i-1)});
</script>
</body>
</html>
